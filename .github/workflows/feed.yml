name: Refresh verified feed

on:
  schedule:
    # Every two hours at :15 IST-independent UTC. GitHub may delay under load.
    - cron: "15 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feed-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the ingestion pipeline
        run: python -m unittest discover -s ingest -t . -p "test_*.py" -v

      - name: Generate the feed from official sources
        run: python ingest/ingest.py

      - name: Commit only when the verified feed changed
        run: |
          if git diff --quiet -- docs/feed; then
            echo "Feed unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "dastakde-feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/feed
          git commit -m "chore(feed): refresh verified opportunities"
          git push
